<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf9f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Tourist - a warm, editorial AI travel companion for planning trips, itineraries and budgets."
    />
    <title>Tourist — Plan the trip, then the days inside it</title>
    <link rel="canonical" href="%SITE_URL%/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <!--
      Only the icons the app uses. The whole variable icon font is 723 KB; this
      subset is about 18 KB. `icon_names` must list every icon name in src,
      sorted. An icon missing from it renders as its name in words, so
      src/__tests__/iconFont.test.ts fails when one is: add the name here.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&icon_names=account_balance_wallet,add,add_card,add_circle,add_location_alt,arrow_back,arrow_forward,auto_awesome,auto_fix_high,auto_stories,calendar_month,check,close,contrast,currency_exchange,dark_mode,dashboard,delete_forever,delete_outline,delete_sweep,directions_subway,donut_large,drive_file_move_outline,edit,edit_note,error,event_available,expand_less,expand_more,explore,explore_off,filter_alt_off,flight_land,flight_takeoff,group,hotel,hourglass_bottom,image_not_supported,info,keep_off,landscape,light_mode,lightbulb,location_on,lock,lock_open,luggage,menu,menu_book,more_horiz,museum,nightlife,note_add,open_in_new,park,person,person_outline,pin_drop,place,push_pin,receipt_long,refresh,remove,restaurant,route,savings,schedule,science,search_off,sell,shopping_bag,smartphone,speed,sticky_note_2,storefront,swap_horiz,task_alt,travel_explore,tune,warning&display=block"
      rel="stylesheet"
    />
    <script>
      /*
        Material Symbols draws its icons from ligature TEXT: the markup really
        says "account_balance_wallet" and the font turns it into a glyph. Until
        that font arrives, every icon in the product renders as its own name in
        words. `display=block` shortens that window but cannot close it, and if
        the font never arrives — blocked network, strict proxy, offline — the
        words stay forever.

        So icons stay hidden until the font is actually usable. `visibility`
        rather than `display` keeps each icon's box, so nothing reflows when
        they appear. If the font never loads the icons simply stay blank, which
        is far better than a screen full of snake_case, and every icon-only
        control already carries its own screen-reader label.
      */
      ;(function () {
        var FAMILY = 'Material Symbols Outlined'
        var FONT = '24px "' + FAMILY + '"'
        var root = document.documentElement
        var reveal = function () {
          root.classList.add('symbols-ready')
        }
        var fonts = document.fonts
        // No Font Loading API: nothing can say when the font is ready, so show the icons.
        if (!fonts || !fonts.load || !fonts.check || !fonts.forEach) return reveal()

        /*
          Usable means the font really loaded. A failed load must NOT reveal:
          this used to run `load(...).then(reveal, reveal)`, which showed the
          icons as words in exactly the case this script exists for.
          `check()` is not enough by itself either. With the stylesheet blocked
          there is no @font-face for the family at all, and browsers then
          answer true, meaning "nothing to load". So a loaded face of this
          family has to be present as well.
        */
        var usable = function () {
          var loaded = false
          fonts.forEach(function (face) {
            if (face.status === 'loaded' && String(face.family).replace(/["']/g, '') === FAMILY) loaded = true
          })
          return loaded && fonts.check(FONT)
        }
        var settle = function () {
          try {
            if (!usable()) return
          } catch (error) {
            return
          }
          reveal()
          if (fonts.removeEventListener) fonts.removeEventListener('loadingdone', settle)
        }
        // A font that arrives late, after the first attempt settled, still reveals.
        if (fonts.addEventListener) fonts.addEventListener('loadingdone', settle)
        try {
          fonts.load(FONT).then(settle, settle)
        } catch (error) {
          settle()
        }
      })()
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tourist" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Tourist — Plan the trip, then the days inside it" />
    <meta
      property="og:description"
      content="Answer a few questions, get a day-by-day itinerary you can argue with, then track what the trip actually costs. Curated guides, drafted plans, your own spending and your own trip notes, saved on your device."
    />
    <meta
      property="og:image"
      content="%SITE_URL%/social-card.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tourist — Plan the trip first. Then plan the days inside it."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tourist — Plan the trip, then the days inside it" />
    <meta
      name="twitter:description"
      content="Draft itineraries you can edit, budgets that separate estimates from what you actually spend, and trip notes that are yours. No account, nothing leaves your device."
    />
    <meta
      name="twitter:image"
      content="%SITE_URL%/social-card.png"
    />
    <meta name="twitter:image:alt" content="Tourist — Plan the trip first. Then plan the days inside it." />
    <script>
      // Resolve the persisted theme before first paint to avoid a flash of the wrong surface.
      ;(function () {
        try {
          var stored = window.localStorage.getItem('tourist.theme')
          var preference = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var prefersDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          var resolved = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference
          document.documentElement.setAttribute('data-theme', resolved)
          document.documentElement.setAttribute('data-theme-preference', preference)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
