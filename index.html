<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf9f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121820" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Tourist - a warm, editorial AI travel companion for planning trips, itineraries and budgets."
    />
    <title>Tourist - AI Travel Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve the persisted theme before first paint to avoid a flash of the wrong surface.
      ;(function () {
        try {
          var stored = window.localStorage.getItem('tourist.theme')
          var preference = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var prefersDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          var resolved = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference
          document.documentElement.setAttribute('data-theme', resolved)
          document.documentElement.setAttribute('data-theme-preference', preference)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
