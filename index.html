<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf9f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121820" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Tourist - a warm, editorial AI travel companion for planning trips, itineraries and budgets."
    />
    <title>Tourist - AI Travel Companion</title>
    <title>Tourist — Plan the trip, then the days inside it</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap"
      rel="stylesheet"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tourist" />
    <meta property="og:title" content="Tourist — Plan the trip, then the days inside it" />
    <meta
      property="og:description"
      content="Answer a few questions, get a day-by-day itinerary you can argue with, then track what the trip actually costs. Curated guides, drafted plans, your own spending and your own trip notes, saved on your device."
    />
    <meta property="og:image" content="/social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tourist — Plan the trip first. Then plan the days inside it."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tourist — Plan the trip, then the days inside it" />
    <meta
      name="twitter:description"
      content="Draft itineraries you can edit, budgets that separate estimates from what you actually spend, and trip notes that are yours. No account, nothing leaves your device."
    />
    <meta name="twitter:image" content="/social-card.png" />
    <meta name="twitter:image:alt" content="Tourist — Plan the trip first. Then plan the days inside it." />
    <script>
      // Resolve the persisted theme before first paint to avoid a flash of the wrong surface.
      ;(function () {
        try {
          var stored = window.localStorage.getItem('tourist.theme')
          var preference = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var prefersDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          var resolved = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference
          document.documentElement.setAttribute('data-theme', resolved)
          document.documentElement.setAttribute('data-theme-preference', preference)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
